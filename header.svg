<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: 'Droid Serif Sub';
        src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
        font-weight: 400;
        font-style: normal;
      }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#1c1d24"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#d4b98c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="180" fill="url(#bg)"/>

  <text x="400" y="90" text-anchor="middle"
        font-family="'Droid Serif Sub', Georgia, serif"
        font-size="40" font-weight="400" letter-spacing="1"
        fill="url(#nameGradient)">
    Vu Hoang Son(Sown)
    <animate attributeName="opacity" values="0.75;1;0.75" dur="5s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="122" text-anchor="middle"
        font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
        font-size="14" letter-spacing="3.5" fill="#8a8a92">
    FULLSTACK SOFTWARE ENGINEER
  </text>

  <line x1="360" y1="140" x2="440" y2="140" stroke="#d4b98c" stroke-width="1" opacity="0.5"/>
</svg>
